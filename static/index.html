<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game log · 2020–2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.8.0/fonts/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
:root {
  --bg:         #ffffff;
  --bg-sec:     #f5f5f4;
  --bg-played:  rgba(186,117,23,.07);
  --text:       #1c1c1c;
  --text-sec:   #6b6b6b;
  --border:     rgba(0,0,0,.10);
  --border-sec: rgba(0,0,0,.20);
  --radius:     8px;
  --acc:        #BA7517;
  --ps-bg: #E6F1FB;  --ps-fg: #0C447C;
  --ns-bg: #FCEBEB;  --ns-fg: #791F1F;
  --pc-bg: #E1F5EE;  --pc-fg: #085041;
  --new-bg:#FAEEDA;  --new-fg:#BA7517;
  --soon-bg:#E6F1FB; --soon-fg:#185FA5;
}
@media(prefers-color-scheme:dark){:root{
  --bg:         #111110;
  --bg-sec:     #1c1c1a;
  --bg-played:  rgba(186,117,23,.09);
  --text:       #ebebeb;
  --text-sec:   #888884;
  --border:     rgba(255,255,255,.09);
  --border-sec: rgba(255,255,255,.20);
  --acc:        #FAC775;
  --ps-bg: #0C447C;  --ps-fg: #B5D4F4;
  --ns-bg: #791F1F;  --ns-fg: #F7C1C1;
  --pc-bg: #085041;  --pc-fg: #9FE1CB;
  --new-bg: rgba(186,117,23,.18);  --new-fg: #FAC775;
  --soon-bg:rgba(24,95,165,.18);   --soon-fg:#85B7EB;
}}
*{ box-sizing:border-box; margin:0; padding:0 }
body{ background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.5 }
.mono{ font-family:'JetBrains Mono',monospace }
.app{ max-width:860px; margin:0 auto; padding:36px 24px 64px }
@media(max-width:600px){ .app{ padding:20px 16px 48px } }
h1{ font-size:22px; font-weight:500; color:var(--text) }
.header-sub{ font-size:13px; color:var(--text-sec); margin-top:3px; letter-spacing:.02em }
.stats{ display:flex; gap:10px; margin:18px 0 24px; flex-wrap:wrap }
.stat{ background:var(--bg-sec); border-radius:var(--radius); padding:10px 16px; min-width:72px }
.stat-label{ font-size:11px; color:var(--text-sec); margin-bottom:1px }
.stat-value{ font-size:22px; font-weight:500; color:var(--text) }
.stat-value.accent{ color:var(--acc) }
.add-game{ background:var(--bg-sec); border:1px solid var(--border-sec); border-radius:var(--radius); padding:20px; margin-bottom:24px }
.add-game-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-end; margin-bottom:14px }
.add-game-note{ font-size:12px; color:var(--text-sec); margin-top:4px }
.add-game-form{ display:grid; gap:14px }
.add-game-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
@media(max-width:560px){ .add-game-row{ grid-template-columns:1fr } }
.field label{ display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-sec) }
.field input, .field select{ width:100%; padding:10px 12px; border:1px solid var(--border-sec); border-radius:var(--radius); background:var(--bg); color:var(--text); font-size:13px; font-family:inherit }
.form-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.form-button{ background:var(--acc); color:#fff; border:none; border-radius:var(--radius); padding:10px 16px; font-size:13px; font-weight:500; cursor:pointer }
.form-button:disabled{ opacity:.5; cursor:default }
.form-error{ color:#c0392b; font-size:13px }
.controls{ display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; align-items:center }
.search-wrap{ position:relative; flex:1 1 180px }
.search-wrap input{ width:100%; padding:7px 12px 7px 32px; border:1px solid var(--border-sec); border-radius:var(--radius); background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:border-color .15s }
.search-wrap input:focus{ border-color:var(--acc) }
.search-icon{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-sec); font-size:16px; pointer-events:none }
.filter-group{ display:flex; gap:4px; flex-wrap:wrap }
.filter-group button{ background:transparent; border:1px solid var(--border-sec); border-radius:var(--radius); color:var(--text-sec); padding:6px 12px; font-size:11px; font-weight:500; font-family:'JetBrains Mono',monospace; cursor:pointer; letter-spacing:.03em; transition:border-color .15s, color .15s }
.filter-group button:hover{ color:var(--text) }
.year-header{ display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; margin-bottom:5px; padding:3px 0 }
.year-header:hover .year-num{ color:var(--text) }
.year-num{ font-size:26px; font-weight:500; color:var(--text-sec); line-height:1; transition:color .15s }
.year-meta{ font-size:11px; color:var(--text-sec) }
.year-line{ flex:1; height:.5px; background:var(--border) }
.year-toggle{ font-size:11px; color:var(--text-sec) }
.year-bar{ height:2px; background:var(--border); border-radius:1px; margin-bottom:8px; overflow:hidden }
.year-bar-fill{ height:100%; background:var(--acc); border-radius:1px; transition:width .3s }
.game-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px 10px; margin-bottom:30px }
@media(max-width:560px){ .game-grid{ grid-template-columns:minmax(0,1fr) } }
.game-row{ display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:var(--radius); cursor:pointer; transition:background .1s }
.game-row:hover{ background:var(--bg-sec) }
.game-row.played{ background:var(--bg-played) }
.game-row.dim{ opacity:.40 }
.game-row.soon{ opacity:.72 }
.dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; border:1px solid var(--border-sec); transition:all .15s }
.game-row.played .dot{ background:var(--acc); border-color:var(--acc) }
.badge{ font-size:11px; font-weight:500; font-family:'JetBrains Mono',monospace; padding:1px 6px; border-radius:4px; flex-shrink:0; letter-spacing:.03em }
.badge-ps{ background:var(--ps-bg); color:var(--ps-fg) }
.badge-nintendo{ background:var(--ns-bg); color:var(--ns-fg) }
.badge-multi{ background:var(--pc-bg); color:var(--pc-fg) }
.game-title{ flex:1; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.game-row.played .game-title{ color:var(--text-sec); text-decoration:line-through; text-decoration-color:var(--border-sec) }
.pill{ font-size:11px; font-weight:500; font-family:'JetBrains Mono',monospace; padding:1px 5px; border-radius:4px; flex-shrink:0 }
.pill-new{ background:var(--new-bg); color:var(--new-fg) }
.pill-soon{ background:var(--soon-bg); color:var(--soon-fg) }
.stars{ display:flex; flex-shrink:0 }
.star{ font-size:13px; cursor:pointer; color:var(--border-sec); line-height:1; transition:color .1s }
.star.lit{ color:var(--acc) }
.game-date{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-sec); flex-shrink:0; min-width:34px; text-align:right }
.game-row.soon .game-date{ color:var(--soon-fg) }
.loading{ display:flex; align-items:center; justify-content:center; min-height:40vh }
.loading-text{ font-size:14px; color:var(--text-sec) }
.error-state{ padding:48px 24px; text-align:center }
.error-state h2{ font-size:18px; font-weight:500; margin-bottom:12px }
.error-state p{ color:var(--text-sec); font-size:14px; margin-bottom:8px }
.error-state code{ background:var(--bg-sec); padding:2px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:13px }
.error-detail{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-sec) }
.no-results{ text-align:center; padding:48px; color:var(--text-sec); font-size:14px }
.app-footer{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px; padding-top:14px; border-top:.5px solid var(--border); font-size:11px; color:var(--text-sec); font-family:'JetBrains Mono',monospace; margin-top:8px }
.save-err{ position:fixed; bottom:16px; right:16px; background:#c0392b; color:#fff; padding:8px 14px; border-radius:var(--radius); font-size:12px; font-family:'JetBrains Mono',monospace; pointer-events:none; opacity:0; transition:opacity .2s }
.save-err.visible{ opacity:1 }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
