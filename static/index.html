<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game log · 2020–2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.8.0/fonts/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
/* ── Custom properties (light + dark) ──────────────────────────── */
:root {
  --bg:         #ffffff;
  --bg-sec:     #f5f5f4;
  --bg-played:  rgba(186,117,23,.07);
  --text:       #1c1c1c;
  --text-sec:   #6b6b6b;
  --border:     rgba(0,0,0,.10);
  --border-sec: rgba(0,0,0,.20);
  --radius:     8px;
  --acc:        #BA7517;
  --ps-bg: #E6F1FB;  --ps-fg: #0C447C;
  --ns-bg: #FCEBEB;  --ns-fg: #791F1F;
  --pc-bg: #E1F5EE;  --pc-fg: #085041;
  --new-bg:#FAEEDA;  --new-fg:#BA7517;
  --soon-bg:#E6F1FB; --soon-fg:#185FA5;
}
@media(prefers-color-scheme:dark){:root{
  --bg:         #111110;
  --bg-sec:     #1c1c1a;
  --bg-played:  rgba(186,117,23,.09);
  --text:       #ebebeb;
  --text-sec:   #888884;
  --border:     rgba(255,255,255,.09);
  --border-sec: rgba(255,255,255,.20);
  --acc:        #FAC775;
  --ps-bg: #0C447C;  --ps-fg: #B5D4F4;
  --ns-bg: #791F1F;  --ns-fg: #F7C1C1;
  --pc-bg: #085041;  --pc-fg: #9FE1CB;
  --new-bg: rgba(186,117,23,.18);  --new-fg: #FAC775;
  --soon-bg:rgba(24,95,165,.18);   --soon-fg:#85B7EB;
}}

/* ── Reset & base ───────────────────────────────────────────────── */
*{ box-sizing:border-box; margin:0; padding:0 }
body{ background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.5 }
.mono{ font-family:'JetBrains Mono',monospace }

/* ── Layout ─────────────────────────────────────────────────────── */
.app{ max-width:860px; margin:0 auto; padding:36px 24px 64px }
@media(max-width:600px){ .app{ padding:20px 16px 48px } }

/* ── Header ─────────────────────────────────────────────────────── */
h1{ font-size:22px; font-weight:500; color:var(--text) }
.header-sub{ font-size:13px; color:var(--text-sec); margin-top:3px; letter-spacing:.02em }

/* ── Stats ──────────────────────────────────────────────────────── */
.stats{ display:flex; gap:10px; margin:18px 0 24px; flex-wrap:wrap }
.stat{ background:var(--bg-sec); border-radius:var(--radius); padding:10px 16px; min-width:72px }
.stat-label{ font-size:11px; color:var(--text-sec); margin-bottom:1px }
.stat-value{ font-size:22px; font-weight:500; color:var(--text) }
.stat-value.accent{ color:var(--acc) }

/* ── Controls ───────────────────────────────────────────────────── */
.controls{ display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; align-items:center }
.search-wrap{ position:relative; flex:1 1 180px }
.search-wrap input{
  width:100%; padding:7px 12px 7px 32px;
  border:1px solid var(--border-sec); border-radius:var(--radius);
  background:var(--bg); color:var(--text); font-size:13px; font-family:inherit;
  outline:none; transition:border-color .15s
}
.search-wrap input:focus{ border-color:var(--acc) }
.search-icon{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-sec); font-size:16px; pointer-events:none }
.filter-group{ display:flex; gap:4px; flex-wrap:wrap }
.filter-group button{
  background:transparent; border:1px solid var(--border-sec);
  border-radius:var(--radius); color:var(--text-sec);
  padding:6px 12px; font-size:11px; font-weight:500;
  font-family:'JetBrains Mono',monospace; cursor:pointer;
  letter-spacing:.03em; transition:border-color .15s, color .15s
}
.filter-group button:hover{ color:var(--text) }

/* ── Year section ───────────────────────────────────────────────── */
.year-header{
  display:flex; align-items:center; gap:10px;
  cursor:pointer; user-select:none;
  margin-bottom:5px; padding:3px 0
}
.year-header:hover .year-num{ color:var(--text) }
.year-num{ font-size:26px; font-weight:500; color:var(--text-sec); line-height:1; transition:color .15s }
.year-meta{ font-size:11px; color:var(--text-sec) }
.year-line{ flex:1; height:.5px; background:var(--border) }
.year-toggle{ font-size:11px; color:var(--text-sec) }
.year-bar{ height:2px; background:var(--border); border-radius:1px; margin-bottom:8px; overflow:hidden }
.year-bar-fill{ height:100%; background:var(--acc); border-radius:1px; transition:width .3s }

/* ── Game grid ──────────────────────────────────────────────────── */
.game-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px 10px; margin-bottom:30px }
@media(max-width:560px){ .game-grid{ grid-template-columns:minmax(0,1fr) } }

/* ── Game row ───────────────────────────────────────────────────── */
.game-row{
  display:flex; align-items:center; gap:7px;
  padding:6px 8px; border-radius:var(--radius);
  cursor:pointer; transition:background .1s
}
.game-row:hover{ background:var(--bg-sec) }
.game-row.played{ background:var(--bg-played) }
.game-row.dim{ opacity:.40 }
.game-row.soon{ opacity:.72 }

.dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; border:1px solid var(--border-sec); transition:all .15s }
.game-row.played .dot{ background:var(--acc); border-color:var(--acc) }

.badge{ font-size:11px; font-weight:500; font-family:'JetBrains Mono',monospace; padding:1px 6px; border-radius:4px; flex-shrink:0; letter-spacing:.03em }
.badge-ps       { background:var(--ps-bg);  color:var(--ps-fg)  }
.badge-nintendo { background:var(--ns-bg);  color:var(--ns-fg)  }
.badge-multi    { background:var(--pc-bg);  color:var(--pc-fg)  }

.game-title{ flex:1; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.game-row.played .game-title{ color:var(--text-sec); text-decoration:line-through; text-decoration-color:var(--border-sec) }

.pill{ font-size:11px; font-weight:500; font-family:'JetBrains Mono',monospace; padding:1px 5px; border-radius:4px; flex-shrink:0 }
.pill-new { background:var(--new-bg);  color:var(--new-fg)  }
.pill-soon{ background:var(--soon-bg); color:var(--soon-fg) }

.stars{ display:flex; flex-shrink:0 }
.star{ font-size:13px; cursor:pointer; color:var(--border-sec); line-height:1; transition:color .1s }
.star.lit{ color:var(--acc) }

.game-date{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-sec); flex-shrink:0; min-width:34px; text-align:right }
.game-row.soon .game-date{ color:var(--soon-fg) }

/* ── States ─────────────────────────────────────────────────────── */
.loading{ display:flex; align-items:center; justify-content:center; min-height:40vh }
.loading-text{ font-size:14px; color:var(--text-sec) }
.error-state{ padding:48px 24px; text-align:center }
.error-state h2{ font-size:18px; font-weight:500; margin-bottom:12px }
.error-state p{ color:var(--text-sec); font-size:14px; margin-bottom:8px }
.error-state code{ background:var(--bg-sec); padding:2px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:13px }
.error-detail{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-sec) }
.no-results{ text-align:center; padding:48px; color:var(--text-sec); font-size:14px }

/* ── Footer ─────────────────────────────────────────────────────── */
.app-footer{
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px;
  padding-top:14px; border-top:.5px solid var(--border);
  font-size:11px; color:var(--text-sec);
  font-family:'JetBrains Mono',monospace; margin-top:8px
}

/* ── API indicator ──────────────────────────────────────────────── */
.save-err{ position:fixed; bottom:16px; right:16px; background:#c0392b; color:#fff; padding:8px 14px; border-radius:var(--radius); font-size:12px; font-family:'JetBrains Mono',monospace; pointer-events:none; opacity:0; transition:opacity .2s }
.save-err.visible{ opacity:1 }
</style>
</head>

<script type="module">

// ─── Static game data ─────────────────────────────────────────────────────────
const TODAY = new Date('2026-05-09');

function computeStatus(rel) {
  if (!rel) return 'released';
  const d = new Date(rel), days = (d - TODAY) / 86400000;
  if (days > 30)  return 'upcoming';
  if (days > 0)   return 'soon';
  return -days <= 30 ? 'new' : 'released';
}

  {id:77,yr:2026,t:"Grand Theft Auto VI",d:"Nov 19",p:"multi",rel:"2026-11-19"},
];

const GAMES = RAW.map(g => ({
  ...g,
  status:   computeStatus(g.rel),
  released: !g.rel || new Date(g.rel) <= TODAY,
}));

const PL_LABEL = { multi: 'PC+', ps: 'PS', nintendo: 'NS' };

// ─── API layer ────────────────────────────────────────────────────────────────
const api = {
  state: () =>
    fetch('/api/state').then(r => {
      if (!r.ok) throw new Error(`GET /api/state → ${r.status}`);
      return r.json();
    }),

  update: (id, gs) =>
    fetch(`/api/games/${id}`, {
      method:  'PUT',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(gs),
    }).then(r => {
      if (!r.ok) throw new Error(`PUT /api/games/${id} → ${r.status}`);
      return r.json();
    }),
};

// ─── Components ───────────────────────────────────────────────────────────────

function StatCard({ label, value, accent }) {
  return html`
    <div class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-value mono ${accent ? 'accent' : ''}">${value ?? '—'}</div>
    </div>
  `;
}

function FilterGroup({ options, value, accentVar, onChange }) {
  return html`
    <div class="filter-group">
      ${options.map(opt => html`
        <button
          key=${opt.value}
          onClick=${() => onChange(opt.value)}
          style=${value === opt.value
            ? { borderColor: `var(${accentVar})`, color: `var(${accentVar})` }
            : {}}
        >${opt.label}</button>
      `)}
    </div>
  `;
}

function Stars({ id, rating, onRate }) {
  return html`
    <span class="stars" onClick=${e => e.stopPropagation()}>
      ${[1,2,3,4,5].map(s => html`
        <span
          key=${s}
          class=${'star' + (s <= rating ? ' lit' : '')}
          onClick=${() => onRate(id, s === rating ? 0 : s)}
        >★</span>
      `)}
    </span>
  `;
}

function GameRow({ game, data = {}, onToggle, onRate }) {
  const cls = [
    'game-row',
    data.played             ? 'played' : '',
    game.status === 'soon'  ? 'soon'   : !game.released ? 'dim' : '',
  ].filter(Boolean).join(' ');

  return html`
    <div class=${cls} onClick=${() => onToggle(game.id)}>
      <div class="dot" />
      <span class=${'badge badge-' + game.p}>${PL_LABEL[game.p]}</span>
      <span class="game-title">${game.t}</span>
      ${game.status === 'new'  && html`<span class="pill pill-new">new</span>`}
      ${game.status === 'soon' && html`<span class="pill pill-soon">soon</span>`}
      ${data.played && html`<${Stars} id=${game.id} rating=${data.rating || 0} onRate=${onRate} />`}
      <span class=${'game-date mono' + (game.status === 'soon' ? ' soon-date' : '')}>${game.d}</span>
    </div>
  `;
}

function YearSection({ year, games, gameData, onToggle, onRate, isCollapsed, onCollapse }) {
  const played = games.filter(g => gameData[g.id]?.played).length;
  const pct    = games.length > 0 ? Math.round(played / games.length * 100) : 0;
  const meta   = `${games.length} titles${played > 0 ? ` · ${played}/${games.length} played` : ''}`;

  return html`
    <div>
      <div class="year-header" onClick=${() => onCollapse(year)}>
        <span class="year-num mono">${year}</span>
        <span class="year-meta mono">${meta}</span>
        <div class="year-line" />
        <span class="year-toggle">${isCollapsed ? '▸' : '▾'}</span>
      </div>

      ${played > 0 && !isCollapsed && html`
        <div class="year-bar">
          <div class="year-bar-fill" style=${{ width: pct + '%' }} />
        </div>
      `}

      ${!isCollapsed && html`
        <div class="game-grid">
          ${games.map(g => html`
            <${GameRow}
              key=${g.id}
              game=${g}
              data=${gameData[String(g.id)]}
              onToggle=${onToggle}
              onRate=${onRate}
            />
          `)}
        </div>
      `}
    </div>
  `;
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [gameData,     setGameData]     = useState({});
  const [loading,      setLoading]      = useState(true);
  const [initError,    setInitError]    = useState(null);
  const [saveErr,      setSaveErr]      = useState(false);
  const [search,       setSearch]       = useState('');
  const [platform,     setPlatform]     = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [collapsed,    setCollapsed]    = useState({});

  // Initial load from API
  useEffect(() => {
    api.state()
      .then(data => { setGameData(data || {}); setLoading(false); })
      .catch(err  => { setInitError(err.message); setLoading(false); });
  }, []);

  // Optimistic toggle played — revert on API failure
  const togglePlayed = useCallback(async (id) => {
    const key     = String(id);
    const current = gameData[key] || {};
    const next    = { ...current, played: !current.played };
    setGameData(prev => ({ ...prev, [key]: next }));
    try {
      await api.update(id, next);
    } catch {
      setGameData(prev => ({ ...prev, [key]: current }));
      flashSaveErr();
    }
  }, [gameData]);

  // Optimistic rating update — revert on API failure
  const setRating = useCallback(async (id, rating) => {
    const key     = String(id);
    const current = gameData[key] || {};
    const next    = { ...current, rating };
    setGameData(prev => ({ ...prev, [key]: next }));
    try {
      await api.update(id, next);
    } catch {
      setGameData(prev => ({ ...prev, [key]: current }));
      flashSaveErr();
    }
  }, [gameData]);

  const toggleCollapse = useCallback((year) => {
    setCollapsed(prev => ({ ...prev, [year]: !prev[year] }));
  }, []);

  // Brief error toast on API write failure
  const flashSaveErr = () => {
    setSaveErr(true);
    setTimeout(() => setSaveErr(false), 2500);
  };

  // Derived / filtered data
  const filtered = useMemo(() => GAMES.filter(g => {
    if (search       && !g.t.toLowerCase().includes(search.toLowerCase())) return false;
    if (platform !== 'all' && g.p !== platform)                            return false;
    if (statusFilter === 'released' && !g.released)                        return false;
    if (statusFilter === 'upcoming' &&  g.released)                        return false;
    return true;
  }), [search, platform, statusFilter]);

  const years        = useMemo(() => [...new Set(filtered.map(g => g.yr))].sort((a,b) => a - b), [filtered]);
  const totalPlayed  = useMemo(() => Object.values(gameData).filter(d => d.played).length, [gameData]);
  const totalRel     = useMemo(() => GAMES.filter(g =>  g.released).length, []);
  const totalUp      = useMemo(() => GAMES.filter(g => !g.released).length, []);

  // ── Render states ──────────────────────────────────────────────
  if (loading) return html`
    <div class="loading">
      <span class="loading-text mono">Loading…</span>
    </div>
  `;

  if (initError) return html`
    <div class="error-state">
      <h2>Cannot connect to API</h2>
      <p>Make sure the Go server is running:</p>
      <p><code>go run .</code></p>
      <p class="error-detail">${initError}</p>
    </div>
  `;

  // ── Main render ────────────────────────────────────────────────
  return html`
    <div class="app">
      <header>
        <h1>Game log</h1>
        <p class="header-sub mono">2020 – 2026 · PlayStation · Nintendo · Multi-platform</p>
      </header>

      <div class="stats">
        <${StatCard} label="Total"    value=${GAMES.length} />
        <${StatCard} label="Released" value=${totalRel}     />
        <${StatCard} label="Upcoming" value=${totalUp}      />
        <${StatCard} label="Played"   value=${totalPlayed} accent />
      </div>

      <div class="controls">
        <div class="search-wrap">
          <i class="ti ti-search search-icon" aria-hidden="true" />
          <input
            type="text"
            placeholder="Search titles…"
            value=${search}
            onInput=${e => setSearch(e.target.value)}
          />
        </div>
        <${FilterGroup}
          options=${[
            { value:'all',      label:'All'           },
            { value:'ps',       label:'PlayStation'   },
            { value:'nintendo', label:'Nintendo'      },
            { value:'multi',    label:'Multi-platform'},
          ]}
          value=${platform}
          accentVar="--acc"
          onChange=${setPlatform}
        />
        <${FilterGroup}
          options=${[
            { value:'all',      label:'All'      },
            { value:'released', label:'Released' },
            { value:'upcoming', label:'Upcoming' },
          ]}
          value=${statusFilter}
          accentVar="--soon-fg"
          onChange=${setStatusFilter}
        />
      </div>

      <main>
        ${filtered.length === 0
          ? html`<div class="no-results">No results</div>`
          : years.map(yr => html`
              <${YearSection}
                key=${yr}
                year=${yr}
                games=${filtered.filter(g => g.yr === yr)}
                gameData=${gameData}
                onToggle=${togglePlayed}
                onRate=${setRating}
                isCollapsed=${!!collapsed[yr]}
                onCollapse=${toggleCollapse}
              />
            `)
        }
      </main>

      <footer class="app-footer mono">
        <span>Click a title to mark played · stars to rate · year to collapse</span>
        <span>${totalPlayed}/${GAMES.length} played</span>
      </footer>

      <div class=${'save-err' + (saveErr ? ' visible' : '')}>
        Save failed — check server
      </div>
    </div>
  `;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
